basePath: /
definitions:
  dto.KendaraanRequest:
    properties:
      bahan_bakar:
        enum:
        - bensin
        - solar
        - listrik
        - hybrid
        example: bensin
        type: string
      foto_url:
        example: https://contoh.id/foto.jpg
        type: string
      jenis:
        enum:
        - motor
        - mobil
        - minibus
        - pickup
        - ambulans
        example: minibus
        type: string
      kapasitas_cc:
        example: 1500
        minimum: 0
        type: integer
      keterangan:
        example: Kendaraan operasional harian
        type: string
      kondisi:
        enum:
        - baik
        - rusak_ringan
        - rusak_berat
        example: baik
        type: string
      merek:
        example: Toyota
        maxLength: 50
        type: string
      nomor_mesin:
        example: 1NR-F000001
        maxLength: 50
        type: string
      nomor_polisi:
        example: B 1234 XYZ
        maxLength: 15
        type: string
      nomor_rangka:
        example: MHKA1BA3JKA00001
        maxLength: 50
        type: string
      odometer_km:
        example: 48210
        minimum: 0
        type: integer
      penanggung_jawab_id:
        example: 2
        type: integer
      perangkat_daerah_id:
        example: 1
        type: integer
      status:
        enum:
        - tersedia
        - digunakan
        - perbaikan
        - dihapuskan
        example: tersedia
        type: string
      tahun_produksi:
        example: 2019
        maximum: 2100
        minimum: 1980
        type: integer
      tanggal_pajak:
        example: "2027-02-10"
        type: string
      tanggal_stnk:
        example: "2027-02-10"
        type: string
      tipe:
        example: Avanza
        maxLength: 50
        type: string
      warna:
        example: Silver
        maxLength: 30
        type: string
    required:
    - jenis
    - merek
    - nomor_polisi
    - perangkat_daerah_id
    - tahun_produksi
    - tipe
    - warna
    type: object
  dto.KendaraanResponse:
    properties:
      bahan_bakar:
        example: bensin
        type: string
      created_at:
        example: "2026-11-10T12:00:00+07:00"
        type: string
      foto_url:
        example: ""
        type: string
      id:
        example: 1
        type: integer
      jenis:
        example: minibus
        type: string
      kapasitas_cc:
        example: 1500
        type: integer
      keterangan:
        example: ""
        type: string
      kondisi:
        example: baik
        type: string
      merek:
        example: Toyota
        type: string
      nomor_mesin:
        example: 1NR-F000001
        type: string
      nomor_polisi:
        example: B 1234 XYZ
        type: string
      nomor_rangka:
        example: MHKA1BA3JKA00001
        type: string
      odometer_km:
        example: 48210
        type: integer
      penanggung_jawab_id:
        example: 2
        type: integer
      penanggung_jawab_nama:
        example: Siti Rahmawati
        type: string
      perangkat_daerah_id:
        example: 1
        type: integer
      perangkat_daerah_nama:
        example: Dinas Pendidikan
        type: string
      status:
        example: tersedia
        type: string
      tahun_produksi:
        example: 2019
        type: integer
      tanggal_pajak:
        example: "2027-02-10"
        type: string
      tanggal_stnk:
        example: "2027-02-10"
        type: string
      tipe:
        example: Avanza
        type: string
      updated_at:
        example: "2026-11-10T12:00:00+07:00"
        type: string
      warna:
        example: Silver
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: admin@kdo.go.id
        type: string
      password:
        example: admin123
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      expires_at:
        example: "2026-11-10T22:00:00+07:00"
        type: string
      token:
        example: eyJhbGciOi...
        type: string
      user:
        $ref: '#/definitions/dto.PenggunaResponse'
    type: object
  dto.PegawaiRequest:
    properties:
      email:
        example: siti@kdo.go.id
        maxLength: 100
        type: string
      gelar_belakang:
        maxLength: 30
        type: string
      gelar_depan:
        example: S.Pd
        maxLength: 20
        type: string
      golongan:
        example: III/d
        type: string
      jabatan:
        example: Sekretaris Dinas
        maxLength: 100
        type: string
      nama:
        example: Siti Rahmawati
        maxLength: 100
        type: string
      nip:
        example: "198203152009012002"
        type: string
      pangkat:
        example: Penata Tingkat I
        maxLength: 50
        type: string
      perangkat_daerah_id:
        example: 1
        type: integer
      status_pegawai:
        enum:
        - aktif
        - nonaktif
        - pensiun
        example: aktif
        type: string
      tanggal_lahir:
        example: "1982-03-15"
        type: string
      telepon:
        example: "081200000002"
        maxLength: 20
        type: string
    required:
    - golongan
    - jabatan
    - nama
    - nip
    - perangkat_daerah_id
    type: object
  dto.PegawaiResponse:
    properties:
      created_at:
        example: "2026-11-10T12:00:00+07:00"
        type: string
      email:
        example: siti@kdo.go.id
        type: string
      gelar_belakang:
        example: ""
        type: string
      gelar_depan:
        example: S.Pd
        type: string
      golongan:
        example: III/d
        type: string
      id:
        example: 1
        type: integer
      jabatan:
        example: Sekretaris Dinas
        type: string
      nama:
        example: Siti Rahmawati
        type: string
      nip:
        example: "198203152009012002"
        type: string
      pangkat:
        example: Penata Tingkat I
        type: string
      perangkat_daerah_id:
        example: 1
        type: integer
      perangkat_daerah_nama:
        example: Dinas Pendidikan
        type: string
      status_pegawai:
        example: aktif
        type: string
      tanggal_lahir:
        example: "1982-03-15"
        type: string
      telepon:
        example: "081200000002"
        type: string
      updated_at:
        example: "2026-11-10T12:00:00+07:00"
        type: string
    type: object
  dto.PenggunaResponse:
    properties:
      email:
        example: admin@kdo.go.id
        type: string
      id:
        example: 1
        type: integer
      nama:
        example: Administrator
        type: string
      role:
        example: admin
        type: string
    type: object
  dto.PerangkatDaerahRequest:
    properties:
      alamat:
        example: Jl. Merdeka No. 1
        type: string
      email:
        example: disdik@kdo.go.id
        maxLength: 100
        type: string
      is_active:
        example: true
        type: boolean
      kode:
        example: DISPENDIK
        maxLength: 20
        type: string
      nama:
        example: Dinas Pendidikan
        maxLength: 150
        type: string
      nama_kepala:
        example: Drs. Bambang Sutrisno, M.Si
        maxLength: 100
        type: string
      singkatan:
        example: Disdik
        maxLength: 30
        type: string
      telepon:
        example: 021-5550101
        maxLength: 20
        type: string
    required:
    - kode
    - nama
    type: object
  dto.PerangkatDaerahResponse:
    properties:
      alamat:
        example: Jl. Merdeka No. 1
        type: string
      created_at:
        example: "2026-11-10T12:00:00+07:00"
        type: string
      email:
        example: disdik@kdo.go.id
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      kode:
        example: DISPENDIK
        type: string
      nama:
        example: Dinas Pendidikan
        type: string
      nama_kepala:
        example: Drs. Bambang Sutrisno, M.Si
        type: string
      singkatan:
        example: Disdik
        type: string
      telepon:
        example: 021-5550101
        type: string
      updated_at:
        example: "2026-11-10T12:00:00+07:00"
        type: string
    type: object
  handler.HealthResponse:
    properties:
      database:
        example: up
        type: string
      status:
        example: ok
        type: string
      time:
        example: "2026-11-10T10:00:00+07:00"
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  response.ErrorBody:
    properties:
      error:
        $ref: '#/definitions/response.ErrorDetail'
    type: object
  response.ErrorDetail:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      details: {}
      message:
        example: Data tidak valid
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: muhamadarsaludin71@gmail.com
    name: Muhamad Arsaludin
  description: |-
    API Aplikasi Kendaraan Dinas Operasional (KDO).
    Kelola kendaraan dinas, pegawai, perangkat daerah, peminjaman, dan servis.
  title: KDO API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login dengan email dan password, mengembalikan token JWT.
      parameters:
      - description: Kredensial pengguna
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: data berisi token dan profil
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Login
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Mengembalikan data pengguna berdasarkan token JWT.
      produces:
      - application/json
      responses:
        "200":
          description: data berisi profil pengguna
          schema:
            $ref: '#/definitions/dto.PenggunaResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Profil pengguna aktif
      tags:
      - auth
  /api/v1/kendaraan:
    get:
      description: Mendukung search nopol/merek/tipe, filter OPD/kondisi/status/jenis/tahun,
        sorting, dan pagination.
      parameters:
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (default 10, max 100)
        in: query
        name: limit
        type: integer
      - description: Cari nomor polisi, merek, atau tipe
        in: query
        name: search
        type: string
      - description: Filter perangkat daerah
        in: query
        name: perangkat_daerah_id
        type: integer
      - description: baik|rusak_ringan|rusak_berat
        in: query
        name: kondisi
        type: string
      - description: tersedia|digunakan|perbaikan|dihapuskan
        in: query
        name: status
        type: string
      - description: motor|mobil|minibus|pickup|ambulans
        in: query
        name: jenis
        type: string
      - description: Filter tahun produksi
        in: query
        name: tahun
        type: integer
      - description: nomor_polisi|merek|tahun_produksi|created_at
        in: query
        name: sort
        type: string
      - description: asc|desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: dibungkus data + meta
          schema:
            items:
              $ref: '#/definitions/dto.KendaraanResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Daftar kendaraan
      tags:
      - kendaraan
    post:
      consumes:
      - application/json
      parameters:
      - description: Data kendaraan
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.KendaraanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: dibungkus data
          schema:
            $ref: '#/definitions/dto.KendaraanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Tambah kendaraan
      tags:
      - kendaraan
  /api/v1/kendaraan/{id}:
    delete:
      description: Menolak penghapusan bila masih ada peminjaman aktif.
      parameters:
      - description: ID kendaraan
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: tidak ada isi
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Hapus kendaraan
      tags:
      - kendaraan
    get:
      parameters:
      - description: ID kendaraan
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: dibungkus data
          schema:
            $ref: '#/definitions/dto.KendaraanResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Detail kendaraan
      tags:
      - kendaraan
    put:
      consumes:
      - application/json
      description: Status tidak dapat diubah selama masih ada peminjaman aktif.
      parameters:
      - description: ID kendaraan
        in: path
        name: id
        required: true
        type: integer
      - description: Data kendaraan
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.KendaraanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: dibungkus data
          schema:
            $ref: '#/definitions/dto.KendaraanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Ubah kendaraan
      tags:
      - kendaraan
  /api/v1/pegawai:
    get:
      description: Mendukung search nama/NIP, filter OPD/golongan/status, sorting,
