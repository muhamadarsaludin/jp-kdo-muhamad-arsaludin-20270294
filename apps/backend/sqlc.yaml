version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations/000001_init.up.sql"
    queries:
      - "db/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/database/sqlc"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_json_tags: false
